<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Step 1: Create a full-screen sky */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Prevents scrollbars as balloons fly away */
            background: linear-gradient(#a1c4fd, #c2e9fb);
            /* Nice sky gradient */
        }

        .sky {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* Step 2: Position and animate the balloons */
        .balloon {
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            /* Start completely off-screen at the bottom */
            font-size: 60px;

            /* Use the HTML --left variable to spread them out horizontally */
            left: var(--left);

            /* Use the HTML --i variable to calculate a custom delay for each */
            animation: flyUp 6s linear infinite;
            animation-delay: calc(var(--i) * 1.2s);
        }

        .balloon2 {
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            left: var(--left);

            /* 1. ใช้ --i ช่วยสุ่มขนาด (ยิ่งค่าน้อย ยิ่งตัวเล็ก) */
            transform: scale(calc(0.5 + var(--i) * 0.15));

            /* 2. ใช้ --i ช่วยปรับความเร็ว (ยิ่งตัวเล็ก ยิ่งลอยช้าลง) */
            animation: flyUp calc(8s - var(--i) * 0.8s) linear infinite;
            animation-delay: calc(var(--i) * 1.2s);
        }

        .balloon3 {
            font-size: 100px;
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            left: var(--left);

            /* 1. ใช้ --i ช่วยสุ่มขนาด (ยิ่งค่าน้อย ยิ่งตัวเล็ก) */
            transform: scale(calc(0.5 + var(--i) * 0.15));

            /* 2. ใช้ --i ช่วยปรับความเร็ว (ยิ่งตัวเล็ก ยิ่งลอยช้าลง) */
            animation: flyUp calc(8s - var(--i) * 0.8s) linear infinite;
            animation-delay: calc(var(--i) * -1.5s);
        }

        .balloon,
        .balloon2,
        .balloon3 {
            font-size: 100px;
        }

        /* Step 3: Define the continuous upward timeline */
        @keyframes flyUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }

            50% {
                transform: translateY(-50vh) translateX(30px) rotate(8deg);
            }

            100% {
                transform: translateY(-110vh) translateX(-20px) rotate(-8deg);
                opacity: 0;
                /* Fade out as they disappear into space */
            }
        }
    </style>
</head>

<body>
    <div class="sky">
        <div class="balloon" style="--i: 1; --left: 15%">🎈</div>
        <div class="balloon" style="--i: 2; --left: 40%">🎈</div>
        <div class="balloon" style="--i: 3; --left: 65%">🎈</div>
        <div class="balloon" style="--i: 4; --left: 80%">🎈</div>
        <div class="balloon" style="--i: 5; --left: 25%">🎈</div>

        <div class="balloon2" style="--i: 1; --left: 15%">🎈</div>
        <div class="balloon2" style="--i: 2; --left: 40%">🎈</div>
        <div class="balloon2" style="--i: 3; --left: 65%">🎈</div>
        <div class="balloon2" style="--i: 4; --left: 80%">🎈</div>
        <div class="balloon2" style="--i: 5; --left: 25%">🎈</div>

        <div class="balloon3" style="--i: 1; --left: 15%">🎈</div>
        <div class="balloon3" style="--i: 2; --left: 40%">🎈</div>
        <div class="balloon3" style="--i: 3; --left: 65%">🎈</div>
        <div class="balloon3" style="--i: 4; --left: 80%">🎈</div>
        <div class="balloon3" style="--i: 5; --left: 25%">🎈</div>
    </div>
</body>

</html>
