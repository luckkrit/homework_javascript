<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div>คลิกที่ child → ผลลัพธ์เรียงตามลำดับ 1 → 2 → 3 → 4 → 5 เป๊ะ:</div>

    <div id="grandparent" class="border bg-blue-500 p-2">
        grandparent <span id="grandparent_count">0</span>
        <div id="parent" class="border bg-green-500 w-full p-2">
            parent <span id="parent_count">0</span>
            <div id="child" class="border bg-red-500 w-full p-2">
                child <span id="child_count">0</span>
                <div id="once" class="border bg-orange-500 w-full p-2">
                    Once <span id="once_count">0</span>
                </div>
            </div>
        </div>
    </div>


    <pre id="log"></pre>
    <script>

        function log(message) {
            console.log(message)
            document.getElementById('log').textContent += message + "\n"
        }

        const grandparent = document.getElementById('grandparent'),
            parent = document.getElementById('parent'),
            child = document.getElementById('child'),
            once = document.getElementById('once')

        // capture: true = ดักตอน "ขาไป" (บอลกำลังเดินทางลงไปหา child)
        grandparent.addEventListener('click', () => log('1. Grandparent - CAPTURE (ขาลง)'), { capture: true });
        parent.addEventListener('click', () => log('2. Parent - CAPTURE (ขาลง)'), { capture: true });

        // ไม่ใส่ capture (หรือ false) = ดักตอน "ขากลับ" (บอลกำลังเดินทางขึ้นจาก child)
        child.addEventListener('click', () => log('3. Child - TARGET'));
        parent.addEventListener('click', () => log('4. Parent - BUBBLE (ขาขึ้น)'));
        grandparent.addEventListener('click', () => log('5. Grandparent - BUBBLE (ขาขึ้น)'));



    </script>
</body>

</html>
