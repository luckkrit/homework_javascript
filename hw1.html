<body>

            <div onclick="changeMode('create')" class="border w-20 h-8 text-center mode">+ Create</div>
        </div>
        <div id="content"></div>
    </div>
    <script>
        let currentMode = 'list'
        function addProduct(f) {
            var formData = new FormData(f);
            // output as an object
            console.log(Object.fromEntries(formData));


            let maxId = 0
            if (products.length > 0) {
                maxId = Math.max(...products.map(o => o.id))
            }
            const newProduct = { id: maxId + 1, ...Object.fromEntries(formData) }
            products.push(newProduct)
            changeMode('list')
            return false
        }
        let modes = {

            list: function () {
                console.log('list')
                let table = `<table class='border'>`
                for (let product of products) {
                    table += '<tr>'
                    for (let p in product) {
                        table += `<td class='border p-2'>${p}: ${product[p]}</td>`
                    }
                    table += `</tr>`
                }
                table += `</table>`
                document.getElementById('content').innerHTML = table
            },
            create: function () {
                console.log('create')
                window.a = function (f) {
                    console.log("work")
                    var formData = new FormData(f);
                    // output as an object
                    console.log(Object.fromEntries(formData));


                    let maxId = 0
                    if (products.length > 0) {
                        maxId = Math.max(...products.map(o => o.id))
                    }
                    const newProduct = { id: maxId + 1, ...Object.fromEntries(formData) }
                    products.push(newProduct)
                    changeMode('list')
                    return false
                }
                // Method 1
                let form = `<form onsubmit="return a(this)">
                                <input name='title' class='border' />
                                <input name='price' class='border' />
                                <input name='description' class='border'/>
                                <input name='category' class='border'/>
                                <button class='border'>Save</button>
                                <button type="reset" class='border'>Clear</button>
                            </form>`
                document.getElementById('content').innerHTML = form
                // Method 2
                // let form2 = `<form id="createForm">
                //                 <input name='title' class='border' />
                //                 <input name='price' class='border' />
                //                 <input name='description' class='border'/>
                //                 <input name='category' class='border'/>
                //                 <button class='border'>Save</button>
                //                 <button type="reset" class='border'>Clear</button>
                //             </form>`
                // document.getElementById('content').innerHTML = form2
                // document.getElementById("createForm").addEventListener("submit", function (e) {
                //     e.preventDefault()
                //     addProduct(this)
                // })
            },

        }
        const products = []
        function changeMode(mode) {
            const buttons = document.getElementsByClassName('mode')
            if (buttons.length > 0) {
                // toggle off active class of old button
                let currentIndex = Object.keys(modes).indexOf(currentMode)
                const currentButton = buttons.item(currentIndex)
                if (currentButton) {
                    if (currentMode != mode) {

                        currentButton.classList.toggle('active')
                    }
                }
                // toggle on active class of latest click button
                let newIndex = Object.keys(modes).indexOf(mode)
                const newButton = buttons.item(newIndex)
                if (newButton) {

                    newButton.classList.toggle('active')
                    modes[mode]() // call button function
                    currentMode = mode
                }
            }
        }

        // AI suggest

        function changeMode(mode) {
            if (currentMode === mode && document.getElementById('content').innerHTML !== '') return // กันกดซ้ำ

            const buttons = document.getElementsByClassName('mode')
            const oldIndex = Object.keys(modes).indexOf(currentMode)
            const newIndex = Object.keys(modes).indexOf(mode)

            buttons.item(oldIndex)?.classList.remove('active')
            buttons.item(newIndex)?.classList.add('active')

            modes[mode]()
            currentMode = mode
        }

        changeMode(currentMode)

    </script>
</body>

</html>
