<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Step 1: Create a full-screen sky */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Prevents scrollbars as balloons fly away */
            background: linear-gradient(#a1c4fd, #c2e9fb);
            /* Nice sky gradient */
        }

        .sky {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* Step 2: Position and animate the balloons */
        .balloon {
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            /* Start completely off-screen at the bottom */
            font-size: 60px;

            /* Use the HTML --left variable to spread them out horizontally */
            left: var(--left);

            /* Use the HTML --i variable to calculate a custom delay for each */
            animation: flyUp 6s linear infinite;
            animation-delay: calc(var(--i) * 1.2s);
        }

        .balloon2 {
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            left: var(--left);

            /* 1. ใช้ --i ช่วยสุ่มขนาด (ยิ่งค่าน้อย ยิ่งตัวเล็ก) */
            transform: scale(calc(0.5 + var(--i) * 0.15));

            /* 2. ใช้ --i ช่วยปรับความเร็ว (ยิ่งตัวเล็ก ยิ่งลอยช้าลง) */
            animation: flyUp calc(8s - var(--i) * 0.8s) linear infinite;
            animation-delay: calc(var(--i) * 1.2s);
        }

        .balloon3 {
            font-size: 100px;
            font-size: 100px;
            position: absolute;
            bottom: -100px;
            left: var(--left);

            /* 1. ใช้ --i ช่วยสุ่มขนาด (ยิ่งค่าน้อย ยิ่งตัวเล็ก) */
            transform: scale(calc(0.5 + var(--i) * 0.15));

            /* 2. ใช้ --i ช่วยปรับความเร็ว (ยิ่งตัวเล็ก ยิ่งลอยช้าลง) */
            animation: flyUp calc(8s - var(--i) * 0.8s) linear infinite;
            animation-delay: calc(var(--i) * -1.5s);
        }

        .balloon,
        .balloon2,
        .balloon3 {
            font-size: 100px;
        }

        /* เลือกส่วนของ SVG เพื่อระบายสีที่สุ่มมา */
        .balloon svg {
            fill: var(--balloon-color, #ff4d4d);
            /* ถ้าไม่มีสีสุ่ม ให้ใช้สีแดงเป็นพื้นหลัง */
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
            /* เติมเงาให้ดูมีมิติ */
        }

        /* Step 3: Define the continuous upward timeline */
        @keyframes flyUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }

            50% {
                transform: translateY(-50vh) translateX(30px) rotate(8deg);
            }

            100% {
                transform: translateY(-110vh) translateX(-20px) rotate(-8deg);
                opacity: 0;
                /* Fade out as they disappear into space */
            }
        }
    </style>
</head>

<body>
    <div class="sky" id="sky"></div>
    <script>
        const sky = document.getElementById('sky');
        const balloonCount = 20;

        // รายการลูกโป่งแบบไม่มีสี (emoji แบบไม่มีสี หรือใช้สัญลักษณ์ 🎈 แล้วปรับสีทับไม่ได้)
        // แนะนำให้เปลี่ยน emoji เป็น Text หรือ SVG เพื่อให้เปลี่ยนสีได้ร้อยเปอร์เซ็นต์ครับ
        for (let i = 0; i < balloonCount; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';

            // เปลี่ยนจาก emoji 🎈 เป็นตัวอักษรหรือใช้ทรงกลม CSS เพื่อให้เปลี่ยนสีได้
            balloon.innerHTML = `
    <svg viewBox="0 0 30 40" width="60" height="80">
      <ellipse cx="15" cy="18" rx="13" ry="16" />
      <polygon points="15,34 12,40 18,40" />
    </svg>
  `;

            // 1. สุ่มสีโทนสว่างสดใส (สุ่มเฉดสี Hue 0 - 360)
            const randomHue = Math.floor(Math.random() * 360);
            const balloonColor = `hsl(${randomHue}, 85%, 65%)`; // กำหนดความอิ่มสี 85% ความสว่าง 65%

            // สุ่มค่าอื่นๆ (เหมือนเดิม)
            const left = Math.random() * 90;
            const size = 0.5 + Math.random() * 0.7;
            const duration = 5 + Math.random() * 5;
            const delay = Math.random() * -10;

            // นำค่าไปใส่ใน CSS Variables หรือ Style โดยตรง
            balloon.style.setProperty('--balloon-color', balloonColor);
            balloon.style.left = `${left}%`;
            balloon.style.transform = `scale(${size})`;
            balloon.style.animationDuration = `${duration}s`;
            balloon.style.animationDelay = `${delay}s`;

            sky.appendChild(balloon);
        }
    </script>
</body>

</html>
