<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="boxes" class="flex gap-2">
        <div class="box border size-10">box</div>
        <div class="box border size-10">box</div>
        <div class="box border size-10">box</div>
    </div>


    <script>
        // Realtime update
        console.log('live')
        const boxes = document.getElementsByClassName('box');
        console.log(boxes.length); // 3

        document.getElementById('boxes').insertAdjacentHTML('beforeend', '<div class="box border size-10">box</div>');
        console.log(boxes.length); // 4 — อัปเดตเองโดยไม่ต้อง query ซ้ำ!

        // Static
        console.log('static')
        const boxes2 = document.querySelectorAll('.box');
        console.log(boxes2.length); // 4

        document.getElementById('boxes').insertAdjacentHTML('beforeend', '<div class="box border size-10">box</div>');
        console.log(boxes2.length); // ยังเป็น 4 — ไม่อัปเดต ต้อง query ใหม่
    </script>
</body>

</html>
