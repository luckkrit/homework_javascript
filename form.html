<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="user">
        <input name="firstName" />
        <input name="lastName" />
        <input name="email" />
        <input name="age" />
        <button>Submit</button>
    </form>
    <script>
        // Way 1 : Key-Values
        class MyForm {
            constructor(id) {
                this.form = document.getElementById(id);
                this.values = {};
                this.errors = {};
                const that = this;

                Array.from(this.form.elements).forEach((input) => {
                    if (!input.name) return;
                    that.values[input.name] = input.value || '';
                    input.addEventListener('input', (e) => {
                        that.values[e.target.name] = e.target.value;
                    });
                });

                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (that.validate() && that.callback) {
                        that.callback(that.values);
                    }
                });
            }

            validate() {
                // ใส่ logic required/pattern ตรงนี้
                return true;
            }

            handleSubmit(callback) {
                this.callback = callback;
            }
        }

        // const myForm = new MyForm('user');
        // myForm.handleSubmit((values) => {
        //     // ส่งข้อมูลจริง เช่น fetch(...) ตรงนี้ ไม่เรียก native submit
        //     console.log(values);
        // });

        // Way 2 : FormData
        class MyForm2 {
            constructor(id) {
                this.form = document.getElementById(id);
                this.callback = null;

                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const data = new FormData(this.form);
                    const values = Object.fromEntries(data.entries());
                    if (this.callback) this.callback(values);
                });
            }

            handleSubmit(callback) {
                this.callback = callback;
            }
        }

        // Way 3 (Proxy)
        function useForm(id) {
            const form = document.getElementById(id);
            const values = {};
            const rules = {};       // เก็บ validation rule ต่อ field
            const errors = {};      // เก็บ error ต่อ field
            let callback = null;

            function register(name, options = {}) {
                values[name] = '';
                rules[name] = options;   // เก็บ { required: true } ไว้
                return {
                    name,
                    onInput: (e) => {
                        values[name] = e.target.value;
                    }
                };
            }

            function validate() {
                let isValid = true;
                for (const [name, rule] of Object.entries(rules)) {
                    const value = values[name];
                    let error = null;

                    if (rule.required && !value) {
                        error = 'กรุณากรอกข้อมูล';
                    } else if (rule.minLength && value.length < rule.minLength) {
                        error = `ต้องมีความยาวอย่างน้อย ${rule.minLength} ตัวอักษร`;
                    } else if (rule.maxLength && value.length > rule.maxLength) {
                        error = `ต้องมีความยาวไม่เกิน ${rule.maxLength} ตัวอักษร`;
                    } else if (rule.pattern && !rule.pattern.test(value)) {
                        error = 'รูปแบบไม่ถูกต้อง';
                    } else if (rule.validate) {
                        const result = rule.validate(value);
                        if (result !== true) error = result || 'ไม่ผ่านการตรวจสอบ';
                    }

                    if (error) {
                        errors[name] = error;
                        isValid = false;
                    } else {
                        delete errors[name];
                    }
                }
                return isValid;
            }

            function applyProps(el, props) {
                Object.entries(props).forEach(([key, value]) => {
                    if (key === 'name') {
                        el.name = value;
                    } else if (key.startsWith('on') && typeof value === 'function') {
                        const eventName = key.slice(2).toLowerCase();
                        el.addEventListener(eventName, value);
                    }
                });
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validate() && callback) {
                    callback(values);
                } else {
                    console.log('errors:', errors); // เช็คตรงนี้ได้ว่า field ไหนพลาด
                }
            });

            return {
                register,
                applyProps,
                errors,
                handleSubmit: (fn) => { callback = fn; }
            };
        }

        const { register, applyProps, errors, handleSubmit } = useForm('user');

        applyProps(
            document.querySelector('[name="firstName"]'),
            register('firstName', { required: true, minLength: 2 })
        );
        applyProps(
            document.querySelector('[name="lastName"]'),
            register('lastName', { required: true, minLength: 2 })
        );

        applyProps(
            document.querySelector('[name="email"]'),
            register('email', { required: true, pattern: /^\S+@\S+\.\S+$/ })
        );
        applyProps(
            document.querySelector('[name="age"]'),
            register('age', { validate: (v) => Number(v) >= 18 || 'ต้องอายุ 18 ปีขึ้นไป' })
        );

        handleSubmit((values) => {
            console.log(errors);
            console.log(values);
        });
    </script>
</body>

</html>
