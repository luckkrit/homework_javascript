<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <button class="border w-20 create-btn">Create Product</button>
    <div class="flex w-full border p-2 products gap-2">
        <div class="border flex flex-col size-20 justify-between">
            <div class="text-lg text-center">
                Shirt
            </div>
            <div class="flex justify-between p-2">
                <button class="plus-btn size-4 border text-base/2 align-middle">+</button>
                <button class="minus-btn size-4 border text-base/2 align-middle">-</button>
            </div>
        </div>

        <div class="border flex flex-col size-20 justify-between">
            <div class="text-lg text-center">
                Skirt
            </div>
            <div class="flex justify-between p-2">
                <button class="plus-btn size-4 border text-base/2 align-middle">+</button>
                <button class="minus-btn size-4 border text-base/2 align-middle">-</button>
            </div>
        </div>
    </div>
    <script>
        // add click events multiple times - memory leak!
        Array.from(document.getElementsByClassName('create-btn')).forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                console.log(this.textContent)

                Array.from(document.getElementsByClassName('products')).forEach(function (div) {

                    div.insertAdjacentHTML('beforeend', `<div class="border flex flex-col size-20 justify-between">
            <div class="text-lg text-center">
                Skirt
            </div>
            <div class="flex justify-between p-2">
                <button class="plus-btn size-4 border text-base/2 align-middle">+</button>
                <button class="minus-btn size-4 border text-base/2 align-middle">-</button>
            </div>
        </div>`)
                    Array.from(document.getElementsByClassName('plus-btn')).forEach(function (btn) {
                        btn.addEventListener('click', function (e) {
                            console.log(this.textContent)
                        })
                    })
                    Array.from(document.getElementsByClassName('minus-btn')).forEach(function (btn) {
                        btn.addEventListener('click', function (e) {
                            console.log(this.textContent)
                        })
                    })
                })
            })
        });
        Array.from(document.getElementsByClassName('plus-btn')).forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                console.log(this.textContent)
            })
        })
        Array.from(document.getElementsByClassName('minus-btn')).forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                console.log(this.textContent)
            })
        })
    </script>
</body>

</html>
