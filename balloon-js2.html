<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Balloons Sandbox</title>
    <style>
        /* [แก้ไข] เติม CSS พื้นหลังท้องฟ้า เพื่อไม่ให้มี scrollbar และคุมพื้นที่เต็มจอ */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(#a1c4fd, #c2e9fb);
        }

        .sky {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* [แก้ไข] เติมสไตล์ของลูกโป่งและแอนิเมชันหลักกลับเข้ามา */
        .balloon {
            position: absolute;
            bottom: -100px;
            /* เริ่มต้นจากใต้จอ */

            /* ใช้แอนิเมชันลอยขึ้นที่เคยเขียนไว้ */
            animation: flyUp 6s linear infinite;
        }

        .balloon svg {
            width: 60px;
            height: 80px;
            /* [แก้ไข] ดึงสีจากตัวแปร --balloon-color ที่สุ่มจาก JavaScript มาใช้งาน */
            fill: var(--balloon-color, #ff6b6b);
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
            /* เติมเงาให้ดูละมุนขึ้น */
        }

        /* [แก้ไข] เติม timeline แอนิเมชันที่หายไปกลับเข้ามา */
        @keyframes flyUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }

            50% {
                transform: translateY(-50vh) translateX(30px) rotate(8deg);
            }

            100% {
                transform: translateY(-110vh) translateX(-20px) rotate(-8deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- [คำแนะนำ] ลบลูกโป่งแบบ Hardcode ใน HTML ออกทั้งหมดแล้ว เพราะเราจะให้ JavaScript เป็นคนสร้างแทนแบบ 100% ครับ -->
    <div id="sky" class="sky"></div>

    <script>
        const sky = document.getElementById('sky');
        const balloonCount = 30; // เพิ่มจำนวนลูกโป่งให้จุใจขึ้นเป็น 30 ลูก

        for (let i = 0; i < balloonCount; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';

            // โครงสร้าง SVG สำหรับระบายสี
            balloon.innerHTML = `
                <svg viewBox="0 0 30 40">
                    <ellipse cx="15" cy="18" rx="13" ry="16" />
                    <polygon points="15,34 12,40 18,40" />
                </svg>
            `;

            // 1. สุ่มสีโทนสว่างสดใส
            const randomHue = Math.floor(Math.random() * 360);
            const balloonColor = `hsl(${randomHue}, 85%, 65%)`;

            // 2. สุ่มค่าทางกายภาพ (ตำแหน่ง, ขนาด, ความเร็ว, เวลาดีเลย์)
            const left = Math.random() * 95; // สุ่มจุดเกิดแนวนอน 0 - 95%
            const size = 0.5 + Math.random() * 0.7; // สุ่มขนาดให้ลอยสูง-ต่ำไม่เท่ากัน (ดูมีระยะตื้นลึก)
            const duration = 6 + Math.random() * 6; // สุ่มความเร็วในการลอย 6 - 12 วินาที
            const delay = Math.random() * -12; // ดีเลย์ติดลบ เพื่อให้เปิดหน้าเว็บมาแล้วลูกโป่งลอยกระจายตัวทันที

            // 3. ส่งค่าสไตล์ที่สุ่มได้เข้าไปที่ตัวลูกโป่ง
            balloon.style.setProperty('--balloon-color', balloonColor);
            balloon.style.left = `${left}%`;

            // เพื่อไม่ให้ฟังก์ชันสุ่มไปทับค่าแอนิเมชันหมุนส่ายใน CSS เราจะปรับขนาด (Scale) ผ่าน style.width แทนครับ
            balloon.style.width = `${60 * size}px`;
            balloon.style.animationDuration = `${duration}s`;
            balloon.style.animationDelay = `${delay}s`;

            sky.appendChild(balloon);
        }
    </script>
</body>

</html>
