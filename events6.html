<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <button id="add">Add</button>
    <div id="boxes" class="flex gap-2">
        <div class="box border size-10">box</div>
        <div class="box border size-10">box</div>
        <div class="box border size-10">box</div>
    </div>


    <script>
        function handleClick(e) {
            console.log('clicked:', e.target.textContent);
        }


        document.getElementById('add').addEventListener('click', () => {
            document.getElementById('boxes').insertAdjacentHTML(
                'beforeend',
                '<div class="box border size-10">box</div>'
            );
        });

        // ต้อง attach ให้ของเดิมเองก่อน เพราะ observer ไม่ครอบคลุมของที่มีอยู่แล้ว
        // document.querySelectorAll('.box').forEach(box => {
        //     box.addEventListener('click', handleClick);
        // });

        // observer จะดักฟังหลังจากโหลดหน้าเสร็จ แสดงว่า box ที่มีอยู่ก่อนหน้า 3 อันจะคลิกไม่ได้
        const observer = new MutationObserver((mutations) => {
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.classList?.contains('box')) {
                        node.addEventListener('click', handleClick);
                    }
                });
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // best case
        // document.getElementById('boxes').addEventListener('click', (e) => {
        //     if (e.target.classList.contains('box')) handleClick(e);
        // });
    </script>
</body>

</html>
