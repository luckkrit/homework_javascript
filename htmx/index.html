<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>htmx + MSW (simulated backend)</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 40px auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .todo-item span {
            flex: 1;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            padding: 6px;
        }

        button {
            cursor: pointer;
        }

        #status {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <h1>Todos <span id="count">— loading —</span></h1>
    <p id="status">Starting MSW mock worker&hellip;</p>

    <form hx-post="/todos" hx-target="#todo-list" hx-swap="beforeend" hx-on::after-request="this.reset()">
        <input type="text" name="title" placeholder="New todo" required />
        <button type="submit">Add</button>
    </form>

    <ul id="todo-list" style="list-style: none; padding: 0;"></ul>

    <!--
    Using the IIFE build here instead of an ES module import from esm.sh.
    esm.sh's ESM bundle injects a `process` polyfill for compatibility,
    which trips MSW's own "am I in a browser?" check and throws:
      "Failed to execute setupWorker in a non-browser environment"
    even though this is genuinely running in the browser. The IIFE build
    sidesteps that resolution path entirely (this is also what MSW's own
    "Usage with CDN" docs recommend).
  -->
    <script src="https://cdn.jsdelivr.net/npm/msw@2.7.3/lib/iife/index.js"></script>
    <script src="./handlers.js"></script>
    <script>
        const { setupWorker } = MockServiceWorker;
        const worker = setupWorker(...handlers);

        // Every /todos, /todos/:id/toggle, /todos/:id request below is FAKE —
        // there is no server. MSW's service worker intercepts it in the browser
        // and the handler in handlers.js returns HTML, just like Bun did before.
        worker.start({
            serviceWorker: { url: "/htmx/mockServiceWorker.js" },
            onUnhandledRequest: "bypass"
        }).then(() => {
            document.getElementById("status").textContent =
                "MSW active — all /todos requests below are simulated, no real server involved.";
            document.getElementById("count").textContent = `${initialCount()} remaining`;
            document.getElementById("todo-list").innerHTML = initialTodosHTML();
            htmx.process(document.getElementById("todo-list"));
        });
    </script>
</body>

</html>
